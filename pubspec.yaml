name: sportpoint
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  postgres: ^3.5.20
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/img/logo_Sport-Point.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/logo_Sport-Point.png"