name: sport_point
description: "SportPoint - Sportverwaltung App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  material_ui: ^1.11.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/img/logo_Sport-Point.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/logo_Sport-Point.png"
